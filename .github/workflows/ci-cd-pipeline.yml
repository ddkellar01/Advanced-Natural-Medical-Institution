name: CI/CD Zero-Downtime Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Complete Test Suite
      run: |
        export PYTHONPATH=.
        pytest tests/ -v

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push Core Orchestrator Container
      uses: docker/build-push-action@v5
      with:
        context: .
        file: deploy/docker/Dockerfile.core
        push: true
        tags: credkellar/natmed-core-engine:latest

    - name: Build and Push NNL / GCN-GAT Engine Container
      uses: docker/build-push-action@v5
      with:
        context: .
        file: deploy/docker/Dockerfile.nnl
        push: true
        tags: credkellar/natmed-nnl-engine:latest
