name: Build & Publish Docker Containers

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    name: Build & Push Docker Hub Images
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract Docker Metadata (Core Orchestrator)
      id: meta_core
      uses: docker/metadata-action@v5
      with:
        images: credkellar/natmed-core-engine
        tags: |
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=semver,pattern={{version}}
          type=sha,prefix=sha-

    - name: Build & Push Core Orchestrator Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: deploy/docker/Dockerfile.core
        push: true
        tags: ${{ steps.meta_core.outputs.tags }}
        labels: ${{ steps.meta_core.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Extract Docker Metadata (NNL Engine)
      id: meta_nnl
      uses: docker/metadata-action@v5
      with:
        images: credkellar/natmed-nnl-engine
        tags: |
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=semver,pattern={{version}}
          type=sha,prefix=sha-

    - name: Build & Push NNL Engine Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: deploy/docker/Dockerfile.nnl
        push: true
        tags: ${{ steps.meta_nnl.outputs.tags }}
        labels: ${{ steps.meta_nnl.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
