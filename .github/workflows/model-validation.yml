name: Hybrid GCN-GAT Model Validation & Inference Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  validate-neural-network:
    name: Validate Neural Network & Model Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch==2.5.0 numpy==2.1.2 pydantic==2.9.2 pytest==8.3.3

    - name: Verify Hybrid GCN-GAT Tensor Flow & Forward Pass
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -c "
        import torch
        from src.studying.hybrid_gcn_gat import HybridGCN_GATModel
        model = HybridGCN_GATModel(num_node_features=64, hidden_dim=128, output_dim=1)
        model.eval()
        x = torch.randn(10, 64)
        adj = torch.eye(10)
        out = model(x, adj)
        print(f'GCN-GAT Forward Pass Verified! Output Shape: {out.shape}, Affinity Score: {out.item():.4f}')
        assert out.shape == (1, 1), 'Invalid tensor output dimension shape.'
        "

    - name: Run Studying Module Tests
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        pytest src/testing/test_studying.py tests/ -v
