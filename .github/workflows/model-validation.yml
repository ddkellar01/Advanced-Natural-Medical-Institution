name: Hybrid GCN-GAT Model Validation & Inference Test

on:
  push:
    paths:
      - 'src/studying/**'
      - 'tests/test_studying.py'
  pull_request:
    paths:
      - 'src/studying/**'
      - 'tests/test_studying.py'

jobs:
  validate-neural-network:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies (PyTorch & Core)
      run: |
        python -m pip install --upgrade pip
        pip install torch==2.2.1 numpy==1.26.4 pytest==8.1.0 pydantic==2.6.4

    - name: Verify Hybrid GCN-GAT Tensor Flow & Forward Pass
      run: |
        python -c "
        import torch
        from src.studying.hybrid_gcn_gat import HybridGCN_GATModel
        model = HybridGCN_GATModel(num_node_features=64, hidden_dim=128, output_dim=1)
        model.eval()
        x = torch.randn(10, 64)
        adj = torch.eye(10)
        out = model(x, adj)
        print(f'Forward pass successful! Output shape: {out.shape}, Affinity Score: {out.item():.4f}')
        assert out.shape == (1, 1), 'Invalid output dimension shape.'
        "

    - name: Run Studying Module Tests
      run: |
        pytest tests/test_studying.py -v
