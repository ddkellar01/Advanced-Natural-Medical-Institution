name: Security Scan & Vulnerability Audit

on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Security Tools
      run: |
        pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit Security Linting (Source Code)
      run: |
        bandit -r src/ security/ -ll -ii

    - name: Run Safety Scan (Dependency Vulnerability Audit)
      run: |
        safety scan --file requirements.txt || true

