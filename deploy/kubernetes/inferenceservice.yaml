apiVersion: "serving.kserve.io/v1beta1"
kind: "InferenceService"
metadata:
  name: "natural-medicine-inferenceservice"
  namespace: "advanced-natural-medicine"
spec:
  predictor:
    model:
      modelFormat:
        name: pytorch
      storageUri: "gs://natmed-model-registry/gnn-phytochemical-v2"
      resources:
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "2"
          memory: 8Gi
